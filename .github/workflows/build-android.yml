name: Build WORLD Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Regenerate Android platform
        run: flutter create --platforms=android --org com.world .

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Fix Android app version
        run: |
          sed -i 's/versionCode = flutterVersionCode.toInteger()/versionCode = 1/' android/app/build.gradle
          sed -i 's/versionName = flutterVersionName/versionName = "1.0.0"/' android/app/build.gradle

      - name: Remove conflicting Gradle Kotlin file
        run: rm -f android/app/build.gradle.kts android/build.gradle.kts

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: world-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
